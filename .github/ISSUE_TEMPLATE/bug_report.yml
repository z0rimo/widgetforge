name: Bug report
description: The CLI or the agent skill installer crashes, hangs, exits with the wrong code, or prints invalid JSON
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, private keys, tokens, signing material, company or customer code, or personal data. Reduce your project to a minimal synthetic example first.
        For wrong or missing diagnostics use the "Incorrect or missing diagnosis" form. For installation problems use the "Installation / CLI problem" form.
        The JSON report contains `projectPath`, an absolute path that can include your user name; replace it before pasting.
  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      options:
        - widgettriage doctor
        - widgettriage verify
        - Agent skill installer (scripts/install_agent_skill.dart)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WidgetTriage version
      description: Output of `widgettriage --version`, or the release tag / commit.
    validations:
      required: true
  - type: input
    id: dart
    attributes:
      label: Dart SDK version and OS
      description: Output of `dart --version` and your operating system.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command that was run
      placeholder: widgettriage doctor --json <path>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The exit code (0, 1 or 2), stdout and stderr, trimmed of anything private. Exit code 2 prints a plain message on stderr and no JSON by design.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps, or a minimal synthetic project / archive. Describe where to get it if it is too large to paste.
    validations:
      required: true
