name: widgetforge
description: Read-only doctor CLI that statically diagnoses Flutter home screen widget (Android AppWidget/RemoteViews and iOS WidgetKit) configuration problems, with AI-friendly JSON output.
version: 0.1.0
repository: https://github.com/z0rimo/widgetforge
publish_to: none

environment:
  sdk: ^3.5.0

executables:
  widgetforge:

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  xml: ^6.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
